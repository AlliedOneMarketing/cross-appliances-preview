<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">

<meta name="format-detection" content="telephone=yes">
<title>Cross Appliances — Discount Appliances, Service &amp; Repairs | Weatherford, TX</title>
<meta name="description" content="Family-owned discount appliance store in Weatherford, Texas. Like-new washers, dryers, refrigerators and ranges with warranty, delivery and in-house repair. Two locations. Acima and Snap Finance available.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --graphite:#16191C; --steel:#2B3238; --iron:#3F4850; --brushed:#8D959C;
  --fog:#C9CED2; --line:#E2DED7; --paper:#F4F1EC; --bone:#FFFFFF;
  --rust:#C24A1E; --rust-deep:#933410; --tag:#2E6B4C; --amber:#C88A14;
  --fh:'Archivo','Helvetica Neue',Arial,sans-serif;
  --fb:'Inter','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
img{max-width:100%}
button,a,select,input,textarea,.unit,.slot,.day,.stockrow{-webkit-tap-highlight-color:rgba(194,74,30,.16)}
.intakegrid{display:grid;grid-template-columns:280px 1fr;gap:26px}
.pricegrid{display:grid;grid-template-columns:1fr 1fr;gap:30px}
body{background:var(--paper);color:var(--graphite);font-family:var(--fb);-webkit-font-smoothing:antialiased;line-height:1.5;
     display:flex;flex-direction:column;min-height:100%;overflow-x:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px;width:100%}
.hide{display:none !important}

/* ---------- STICKY-FOOTER SHELL ---------- */
#app{flex:1 0 auto;display:flex;flex-direction:column;min-height:0}
#app > *{flex:0 0 auto;min-width:0;max-width:100%}
footer.site{margin-top:auto}

/* ---------- CHROME ---------- */
.demobar{background:var(--rust);color:#fff;font-family:var(--fh);font-weight:700;font-size:11px;letter-spacing:.13em;text-transform:uppercase;text-align:center;padding:7px 16px;flex:0 0 auto}
:root{--hh:98px}
.topbar{position:sticky;top:0;z-index:60;flex:0 0 auto}

/* utility strip */
.util{background:#0E1113;color:var(--fog);font-size:12px;padding-top:env(safe-area-inset-top)}
.util .wrap{display:flex;align-items:center;gap:10px;height:34px}
.util a,.util span{white-space:nowrap}
.u-phone{display:inline-flex;align-items:center;gap:7px;color:#fff;text-decoration:none;font-family:var(--fh);font-weight:800;font-size:12.5px;letter-spacing:.03em}
.u-phone svg{width:13px;height:13px;color:var(--rust)}
.u-phone:hover{color:var(--rust)}
.u-sep{color:#454c52}
.u-item{color:var(--brushed);font-size:11.5px}
.u-right{margin-left:auto;font-family:var(--fh);font-weight:700;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--brushed)}

/* main bar */
.mainbar{background:var(--graphite);color:var(--paper);border-bottom:1px solid rgba(255,255,255,.09)}
.mainbar .wrap{display:flex;align-items:center;gap:14px;height:64px}
.logo{font-family:var(--fh);font-weight:900;font-size:19px;letter-spacing:-.01em;text-transform:uppercase;white-space:nowrap;cursor:pointer;flex:0 0 auto}
.logo em{font-style:normal;color:var(--rust)}
.nav{display:flex;gap:2px;flex:1;justify-content:center}
.nav button{font-family:var(--fh);font-weight:600;font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--fog);padding:10px 13px;border-bottom:2px solid transparent;border-radius:0}
.nav button:hover{color:#fff}
.nav button.on{color:#fff;border-bottom-color:var(--rust)}
.callbtn{display:none;align-items:center;gap:7px;background:var(--rust);color:#fff;font-family:var(--fh);font-weight:800;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;padding:12px 15px;min-height:44px;text-decoration:none;flex:0 0 auto}
.callbtn svg{width:14px;height:14px}
.callbtn:hover{background:var(--rust-deep)}
.modeswitch{display:flex;border:1px solid rgba(244,241,236,.25);align-items:stretch;flex:0 0 auto}
.modeswitch button{font-family:var(--fh);font-weight:700;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:8px 12px;color:var(--fog);display:flex;align-items:center;gap:6px;min-height:40px}
.modeswitch button.on{background:var(--paper);color:var(--graphite)}
.lock{width:9px;height:9px;flex:0 0 auto}

/* burger + mobile drawer */
.burger{display:none;width:44px;height:44px;flex:0 0 auto;flex-direction:column;justify-content:center;gap:5px;padding:0 11px;margin-left:-11px}
.burger span{display:block;height:2px;background:var(--paper);transition:.18s;transform-origin:center}
.burger.on span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger.on span:nth-child(2){opacity:0}
.burger.on span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.mobmenu{display:none;background:var(--graphite);border-top:1px solid rgba(255,255,255,.1);max-height:calc(100vh - var(--hh));overflow-y:auto;-webkit-overflow-scrolling:touch}
.mobmenu.open{display:block}
.mobmenu .wrap{padding-top:6px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.mobmenu .mlink{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;
  font-family:var(--fh);font-weight:700;font-size:15px;letter-spacing:.03em;color:var(--paper);
  padding:16px 2px;border-bottom:1px solid rgba(255,255,255,.09);min-height:52px}
.mobmenu .mlink.on{color:var(--rust)}
.mobmenu .mlink span.c{font-family:var(--fb);font-weight:500;font-size:12px;color:var(--brushed)}
.mobmenu .mcall{display:flex;align-items:center;justify-content:center;gap:9px;background:var(--rust);color:#fff;text-decoration:none;
  font-family:var(--fh);font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;padding:17px;margin:16px 0 12px}
.mobmenu .mcall svg{width:17px;height:17px}
.mobmenu .minfo{font-size:12.5px;color:var(--brushed);line-height:1.7;padding-bottom:6px}
.mobmenu .minfo b{color:var(--paper);font-family:var(--fh);font-weight:700;font-size:11px;letter-spacing:.13em;text-transform:uppercase;display:block;margin-bottom:4px}
.mobmenu .mstaff{width:100%;border:1.5px solid rgba(255,255,255,.28);color:var(--fog);font-family:var(--fh);font-weight:700;
  font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;padding:14px;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px}

/* ---------- TYPO / BUTTONS ---------- */
h1,h2,h3,h4{font-family:var(--fh);letter-spacing:-.01em}
.eyebrow{font-family:var(--fh);font-weight:700;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--rust)}
.ph1{font-weight:900;font-size:clamp(28px,4.2vw,40px);line-height:1.02;margin:8px 0 10px}
.plede{max-width:64ch;color:var(--iron);margin-bottom:26px}
.btn{font-family:var(--fh);font-weight:800;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;padding:13px 22px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.12s;text-decoration:none}
.btn:disabled{opacity:.35;cursor:not-allowed}
.b-rust{background:var(--rust);color:#fff}.b-rust:hover:not(:disabled){background:var(--rust-deep)}
.b-dark{background:var(--graphite);color:var(--paper)}.b-dark:hover:not(:disabled){background:var(--steel)}
.b-ghost{background:transparent;border:2px solid var(--graphite);color:var(--graphite)}.b-ghost:hover{background:var(--graphite);color:var(--paper)}
.b-light{background:transparent;border:2px solid var(--paper);color:var(--paper)}.b-light:hover{background:var(--paper);color:var(--graphite)}
.b-sm{padding:9px 14px;font-size:11px}
.chip{font-family:var(--fh);font-weight:800;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:5px 9px;display:inline-block;white-space:nowrap}
.c-a{background:var(--tag);color:#fff}.c-b{background:var(--graphite);color:var(--paper)}
.c-c{background:var(--amber);color:#221a06}.c-md{background:var(--rust);color:#fff}
.c-out{background:transparent;color:var(--iron);border:1.5px solid rgba(22,25,28,.25)}
.c-sold{background:var(--brushed);color:#fff}

.hero:before{content:"";position:absolute;inset:0;background:
  linear-gradient(96deg, rgba(13,16,18,.95) 0%, rgba(13,16,18,.90) 26%, rgba(15,18,21,.80) 46%, rgba(15,18,21,.70) 62%, rgba(15,18,21,.64) 100%),
  repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,transparent 1px 56px)}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.35fr .65fr;gap:44px;align-items:center}
.hero h1{font-weight:900;font-size:clamp(32px,4.8vw,54px);line-height:.98;letter-spacing:-.03em;text-transform:uppercase;margin:16px 0 14px}
.hero p{color:var(--fog);max-width:48ch;font-size:15.5px}
.hero .cta{display:flex;gap:11px;margin-top:24px;flex-wrap:wrap}
.hero .fam{display:block;font-family:var(--fh);font-weight:700;font-size:10.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--fog);margin-top:18px}
.hstats{display:grid;gap:1px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.hstat{background:rgba(14,17,19,.72);padding:16px 18px}
.hstat b{display:block;font-family:var(--fh);font-weight:900;font-size:30px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hstat span{font-family:var(--fh);font-weight:600;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--brushed)}

/* ---------- FILTERS ---------- */
.filters{background:var(--bone);border-bottom:1px solid var(--line);position:sticky;top:var(--hh);z-index:50}
.filters .wrap{display:flex;gap:12px;align-items:center;padding-top:14px;padding-bottom:14px;flex-wrap:wrap}
.fgroup{display:flex;flex-direction:column;gap:4px;min-width:0}
.fgroup select,.fgroup input{max-width:100%;min-width:0}
.fgroup label{font-family:var(--fh);font-weight:700;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--brushed)}
select,input[type=text],input[type=tel],input[type=email],input[type=number],input[type=password],input[type=date],textarea{
  border:1px solid var(--line);background:var(--bone);padding:9px 11px;font-size:14px;outline:none;border-radius:0}
select:focus,input:focus,textarea:focus{border-color:var(--rust)}
.fcount{margin-left:auto;font-family:var(--fh);font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--iron)}

/* ---------- GRID ---------- */
.section{padding:44px 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.unit{background:var(--bone);border:1px solid var(--line);display:flex;flex-direction:column;text-align:left;transition:.12s}
.unit:hover{border-color:var(--graphite);transform:translateY(-2px)}
.unit .img{aspect-ratio:1/1;background:linear-gradient(170deg,#EFEBE4,#DAD4CA);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.unit .img img{width:100%;height:100%;object-fit:cover}
.unit .img svg{width:56%;height:56%}
.unit .tags{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:5px;align-items:flex-start;z-index:2}
.unit .tagsR{position:absolute;top:10px;right:10px;z-index:2}
.unit .body{padding:15px 15px 17px;flex:1;display:flex;flex-direction:column}
.unit .brand{font-family:var(--fh);font-weight:700;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--brushed)}
.unit .name{font-family:var(--fh);font-weight:800;font-size:15.5px;line-height:1.22;margin:4px 0 auto;min-height:38px}
.unit .price{font-family:var(--fh);font-weight:900;font-size:28px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:12px;display:flex;align-items:baseline;gap:8px}
.unit .was{font-family:var(--fb);font-weight:500;font-size:13px;color:var(--brushed);text-decoration:line-through;letter-spacing:0}
.unit .foot{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:11px;color:var(--iron);gap:8px}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;border:1px dashed var(--line);color:var(--iron)}

/* ---------- MODAL ---------- */
.scrim{position:fixed;inset:0;background:rgba(22,25,28,.72);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:34px 18px;overflow-y:auto}
.modal{background:var(--paper);max-width:860px;width:100%;border:1px solid var(--graphite)}
.modal.sm{max-width:520px}
.mhead{background:var(--graphite);color:var(--paper);padding:15px 22px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.mhead h3{font-weight:800;font-size:14px;letter-spacing:.09em;text-transform:uppercase}
.mhead button{color:var(--fog);font-size:24px;line-height:1;padding:0 4px}
.mhead button:hover{color:#fff}
.mbody{padding:26px}
.det{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.det .ph{aspect-ratio:1/1;background:linear-gradient(170deg,#EFEBE4,#DAD4CA);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}
.det .ph img{width:100%;height:100%;object-fit:cover}
.det .ph svg{width:62%;height:62%}
.det h2{font-weight:900;font-size:27px;line-height:1.1;letter-spacing:-.02em;margin:6px 0 12px}
.bigprice{font-family:var(--fh);font-weight:900;font-size:48px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1;display:flex;align-items:baseline;gap:12px;margin:14px 0 6px}
.bigprice .was{font-family:var(--fb);font-weight:500;font-size:19px;color:var(--brushed);text-decoration:line-through;letter-spacing:0}
.why{background:var(--bone);border-left:3px solid var(--rust);padding:11px 14px;font-size:13px;color:var(--iron);margin:12px 0 18px}
.specs{width:100%;border-collapse:collapse;margin:16px 0 20px;font-size:13.5px}
.specs td{padding:8px 0;border-bottom:1px solid var(--line)}
.specs td:first-child{color:var(--brushed);font-family:var(--fh);font-weight:700;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;width:44%;vertical-align:top}
.stack{display:flex;flex-direction:column;gap:9px}
.checked{background:var(--bone);border:1px solid var(--line);padding:15px 17px;margin:0 0 18px}
.checked h4{font-family:var(--fh);font-weight:800;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--iron);margin-bottom:10px}
.checked ul{list-style:none}
.checked li{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;padding:4px 0}
.checked li svg{width:13px;height:13px;flex:0 0 auto;margin-top:4px;color:var(--tag)}

/* ---------- FORMS ---------- */
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.f{display:flex;flex-direction:column;gap:5px}
.f.full{grid-column:1/-1}
.f label{font-family:var(--fh);font-weight:700;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--iron)}
.f input,.f select,.f textarea{width:100%}
.hint{font-size:11.5px;color:var(--brushed)}
.sumbox{background:var(--bone);border:1px solid var(--line);padding:16px;margin:16px 0}
.sumrow{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.sumrow.tot{border-top:2px solid var(--graphite);margin-top:8px;padding-top:11px;font-family:var(--fh);font-weight:900;font-size:19px;font-variant-numeric:tabular-nums}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:8px}
.slot{border:1px solid var(--line);background:var(--bone);padding:11px 8px;text-align:center;transition:.1s}
.slot:hover:not(:disabled){border-color:var(--graphite)}
.slot.on{background:var(--graphite);color:var(--paper);border-color:var(--graphite)}
.slot:disabled{opacity:.4;cursor:not-allowed;background:#EDE9E2}
.slot b{display:block;font-family:var(--fh);font-weight:800;font-size:12.5px}
.slot span{font-size:10.5px;color:inherit;opacity:.72}
.days{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;padding-bottom:6px;margin-top:8px}
.day{border:1px solid var(--line);background:var(--bone);padding:10px 13px;text-align:center;min-width:74px;flex:0 0 auto}
.day.on{background:var(--rust);color:#fff;border-color:var(--rust)}
.day:disabled{opacity:.35;cursor:not-allowed}
.day b{display:block;font-family:var(--fh);font-weight:900;font-size:19px;line-height:1}
.day span{font-size:9.5px;font-family:var(--fh);font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.ok{text-align:center;padding:22px 6px}
.ok .tick{width:62px;height:62px;border-radius:50%;background:var(--tag);color:#fff;display:flex;align-items:center;justify-content:center;font-size:31px;margin:0 auto 16px}
.ok h2{font-weight:900;font-size:25px;margin-bottom:8px}
.ok p{color:var(--iron);max-width:46ch;margin:0 auto 6px;font-size:14.5px}
.conf{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:16px;background:var(--bone);border:1px dashed var(--graphite);padding:11px 16px;display:inline-block;margin:14px 0 18px;letter-spacing:.08em}

/* ---------- LOGIN ---------- */
.loginwrap{text-align:center;padding:8px 4px 4px}
.loginwrap .shield{width:54px;height:54px;background:var(--graphite);color:var(--paper);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.loginwrap h2{font-weight:900;font-size:22px;margin-bottom:7px}
.loginwrap p{color:var(--iron);font-size:14px;max-width:42ch;margin:0 auto 20px}
.demo-creds{background:var(--bone);border:1px dashed var(--rust);padding:12px 14px;margin-top:16px;font-size:12.5px;color:var(--iron);text-align:left}
.demo-creds b{font-family:var(--fh);color:var(--graphite);letter-spacing:.05em}
.err{background:#F7E4DE;border-left:3px solid var(--rust);padding:10px 13px;font-size:13px;color:var(--rust-deep);margin-bottom:14px;text-align:left}

/* ---------- LOCATIONS ---------- */
.locgrid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.loccard{background:var(--bone);border:1px solid var(--line);display:flex;flex-direction:column}
.locshot{aspect-ratio:3/2;background:#DCD6CC center/cover no-repeat;position:relative}
.locshot .badge{position:absolute;left:14px;top:14px;z-index:2}
.locshot .plc{position:absolute;right:12px;bottom:11px;font-family:var(--fh);font-weight:700;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#fff;background:rgba(16,19,21,.6);padding:4px 8px}
.locbody{padding:22px}
.locbody h3{font-weight:900;font-size:22px;letter-spacing:-.01em;margin-bottom:4px}
.locmeta{font-size:14px;color:var(--iron);margin-bottom:14px}
.hoursrow{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)}
.hoursrow b{font-family:var(--fh);font-weight:700}
.hoursrow.closed{color:var(--brushed)}
.mapbox{border:1px solid var(--line);border-top:0;background:#E8E4DC;position:relative}
.mapbox svg{display:block;width:100%;height:auto}
.mapattr{position:absolute;right:8px;bottom:6px;font-size:9px;color:#6f7a80;letter-spacing:.04em;background:rgba(255,255,255,.7);padding:2px 6px}
.mapacts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-top:0}
.mapacts a{background:var(--bone);padding:14px 8px;text-align:center;text-decoration:none;font-family:var(--fh);font-weight:800;font-size:11px;letter-spacing:.09em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:6px;transition:.12s}
.mapacts a:hover{background:var(--graphite);color:var(--paper)}
.mapacts svg{width:17px;height:17px}
.stocklist{border:1px solid var(--line);border-top:0;background:var(--bone)}
.stockhead{padding:13px 18px;border-bottom:1px solid var(--line);font-family:var(--fh);font-weight:800;font-size:11px;letter-spacing:.11em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.stockrow{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line);width:100%;text-align:left;transition:.1s}
.stockrow:hover{background:var(--paper)}
.stockrow:last-child{border-bottom:0}
.stockthumb{width:46px;height:46px;background:linear-gradient(170deg,#EFEBE4,#DAD4CA);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:0 0 auto;overflow:hidden}
.stockthumb img{width:100%;height:100%;object-fit:cover}
.stockthumb svg{width:70%;height:70%}
.stockrow .m{flex:1;min-width:0}
.stockrow .m b{display:block;font-family:var(--fh);font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stockrow .m span{font-size:11px;color:var(--brushed)}
.stockrow .pz{font-family:var(--fh);font-weight:900;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- FINANCING ---------- */
.finhero{background:var(--graphite);color:var(--paper);padding:52px 0 56px}
.finhero h1{font-weight:900;font-size:clamp(30px,4.4vw,46px);line-height:1;text-transform:uppercase;letter-spacing:-.03em;margin:14px 0 12px}
.finhero p{color:var(--fog);max-width:56ch;font-size:16px}
.fincards{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:-38px;position:relative;z-index:3}
.fincard{background:var(--bone);border:1px solid var(--line);padding:26px;display:flex;flex-direction:column}
.lockup{height:52px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--fh);font-weight:900;letter-spacing:-.02em;font-size:25px;margin-bottom:18px;width:170px}
.lk-acima{background:#0F9D58}
.lk-snap{background:#12356B}
.lk-snap i{font-style:normal;color:#F5A623}
.fincard h3{font-weight:900;font-size:20px;margin-bottom:8px;letter-spacing:-.01em}
.fincard p.d{font-size:14px;color:var(--iron);margin-bottom:16px}
.finfacts{list-style:none;margin-bottom:20px}
.finfacts li{font-size:13.5px;padding:7px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.finfacts li svg{width:14px;height:14px;flex:0 0 auto;margin-top:3px;color:var(--tag)}
.fincard .btn{margin-top:auto}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:34px}
.step{background:var(--bone);border:1px solid var(--line);padding:22px;position:relative}
.step .n{font-family:var(--fh);font-weight:900;font-size:38px;line-height:1;color:var(--rust);letter-spacing:-.04em}
.step h4{font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.06em;margin:10px 0 7px}
.step p{font-size:13.5px;color:var(--iron)}
.est{background:var(--steel);color:var(--paper);padding:30px;margin-top:34px;display:grid;grid-template-columns:1.1fr .9fr;gap:34px;align-items:center}
.est h3{font-weight:900;font-size:22px;margin-bottom:8px}
.est p{color:var(--fog);font-size:14px}
.est .out{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.16);padding:22px;text-align:center}
.est .out b{display:block;font-family:var(--fh);font-weight:900;font-size:40px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.05}
.est .out span{font-family:var(--fh);font-weight:600;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--brushed);display:block;margin-top:8px}
.est input[type=range]{width:100%;accent-color:var(--rust);margin-top:14px}
.disclaim{font-size:11.5px;color:var(--brushed);margin-top:14px;line-height:1.5}

/* ---------- STAFF CONSOLE ---------- */
.console{background:#101315;min-height:100%;color:var(--paper);flex:1 0 auto;display:flex;flex-direction:column}
.console .wrap{padding-top:26px;padding-bottom:60px}
.ctabs{display:flex;gap:2px;border-bottom:1px solid rgba(255,255,255,.13);margin-bottom:26px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.ctabs button{font-family:var(--fh);font-weight:700;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;padding:13px 17px;color:var(--brushed);border-bottom:2px solid transparent;white-space:nowrap}
.ctabs button.on{color:#fff;border-bottom-color:var(--rust)}
.cpanel{background:#181C1F;border:1px solid rgba(255,255,255,.11);padding:24px;margin-bottom:20px}
.cpanel h3{font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
.cpanel .sub{font-size:13px;color:var(--brushed);margin-bottom:18px;max-width:70ch}
.console .f label{color:var(--brushed)}
.console input,.console select,.console textarea{background:#0E1113;border-color:rgba(255,255,255,.16);color:var(--paper)}
.console input:focus,.console select:focus,.console textarea:focus{border-color:var(--rust)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.11);margin-bottom:20px}
.kpi{background:#181C1F;padding:17px 16px}
.kpi b{display:block;font-family:var(--fh);font-weight:900;font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{font-family:var(--fh);font-weight:600;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--brushed)}
.kpi.warn b{color:var(--amber)} .kpi.good b{color:#57C08B} .kpi.hot b{color:#E5713F}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
table.dt th{font-family:var(--fh);font-weight:700;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--brushed);text-align:left;padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.15);white-space:nowrap}
table.dt td{padding:10px;border-bottom:1px solid rgba(255,255,255,.07);vertical-align:middle}
table.dt tr:hover td{background:rgba(255,255,255,.03)}
.num{font-variant-numeric:tabular-nums;text-align:right;font-family:var(--fh);font-weight:700}
.dropcell{color:#E5713F;font-family:var(--fh);font-weight:800}
.thumb{width:40px;height:40px;background:#22262A;border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:70%;height:70%}
.tdname{display:flex;align-items:center;gap:11px}
.tdname b{font-family:var(--fh);font-weight:700;font-size:13px;display:block}
.tdname span{font-size:11px;color:var(--brushed)}
.modes{display:flex;gap:0;border:1px solid rgba(255,255,255,.18);margin-bottom:18px;flex-wrap:wrap}
.modes button{flex:1;min-width:130px;font-family:var(--fh);font-weight:700;font-size:11px;letter-spacing:.09em;text-transform:uppercase;padding:13px 10px;color:var(--brushed);border-right:1px solid rgba(255,255,255,.18)}
.modes button:last-child{border-right:0}
.modes button.on{background:var(--rust);color:#fff}
.tier{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-bottom:10px}
.rangewrap{margin:6px 0 18px}
input[type=range]{width:100%;accent-color:var(--rust)}
.simbar{background:#241611;border:1px solid var(--rust);padding:16px 20px;margin-bottom:20px}
.simbar .t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:16px;flex-wrap:wrap}
.simbar b{font-family:var(--fh);font-weight:900;font-size:15px}
.drop{background:#0E1113;border:1px solid rgba(255,255,255,.12);padding:11px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:14px;font-size:13px}
.uploadzone{border:2px dashed rgba(255,255,255,.24);padding:22px;text-align:center;cursor:pointer;transition:.12s;position:relative;overflow:hidden;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.uploadzone:hover{border-color:var(--rust)}
.uploadzone img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.uploadzone .lbl{position:relative;z-index:2;font-family:var(--fh);font-weight:800;font-size:12px;letter-spacing:.09em;text-transform:uppercase}
.uploadzone .sm{position:relative;z-index:2;font-size:11.5px;color:var(--brushed)}
.uploadzone.has .lbl,.uploadzone.has .sm{background:rgba(16,19,21,.82);padding:5px 10px}
.sched{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
.sday{background:#0E1113;border:1px solid rgba(255,255,255,.12);padding:14px}
.sday h4{font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
.sday .cap{font-size:10.5px;color:var(--brushed);margin-bottom:10px}
.sday .capbar{height:3px;background:rgba(255,255,255,.1);margin-bottom:11px}
.sday .capbar i{display:block;height:100%;background:var(--tag)}
.sday .capbar i.busy{background:var(--amber)}
.sday .capbar i.full{background:var(--rust)}
.job{background:#181C1F;border-left:3px solid var(--tag);padding:8px 10px;margin-bottom:7px;font-size:12px}
.job.svc{border-left-color:var(--amber)}
.job b{display:block;font-family:var(--fh);font-weight:700;font-size:11.5px}
.job span{color:var(--brushed);font-size:10.5px}
.nojobs{font-size:11.5px;color:#4c545b;font-style:italic}
.callout{background:#0E1113;border-left:3px solid var(--rust);padding:14px 16px;font-size:13px;color:var(--fog);margin-top:16px}
.callout b{color:#fff;font-family:var(--fh)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--tag);color:#fff;font-family:var(--fh);font-weight:800;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;padding:14px 24px;z-index:200;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}

/* ---------- INFO PAGES ---------- */
.panel{background:var(--bone);border:1px solid var(--line);padding:28px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}

/* ---------- SITE FOOTER ---------- */
footer.site{background:var(--graphite);color:var(--brushed);padding:56px 0 0;font-size:13.5px;flex:0 0 auto}
footer.site a{text-decoration:none;color:var(--fog);transition:.1s}
footer.site a:hover{color:#fff}
.fgrid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1.3fr;gap:36px;padding-bottom:40px}
.fcol h4{font-family:var(--fh);font-weight:800;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:#fff;margin-bottom:15px}
.fcol ul{list-style:none}
.fcol li{padding:5px 0}
.fcol li button{font-size:13.5px;color:var(--fog);text-align:left;padding:0}
.fcol li button:hover{color:#fff}
.flogo{font-family:var(--fh);font-weight:900;font-size:22px;letter-spacing:-.01em;text-transform:uppercase;color:#fff;margin-bottom:12px}
.flogo em{font-style:normal;color:var(--rust)}
.ftag{font-size:13.5px;line-height:1.6;margin-bottom:18px;max-width:34ch}
.fphone{display:block;font-family:var(--fh);font-weight:900;font-size:24px;letter-spacing:-.01em;color:#fff;text-decoration:none;margin-bottom:4px}
.fsmall{font-size:11.5px;letter-spacing:.04em}
.fbadges{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}
.fbadge{border:1px solid rgba(255,255,255,.22);padding:5px 9px;font-family:var(--fh);font-weight:700;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--fog)}
.floc{margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.1)}
.floc:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.floc b{font-family:var(--fh);font-weight:800;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:#fff;display:block;margin-bottom:5px}
.floc p{line-height:1.55;font-size:13px}
.fserve{border-top:1px solid rgba(255,255,255,.1);padding:22px 0;font-size:12px;line-height:1.75}
.fserve b{font-family:var(--fh);font-weight:800;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--fog);display:block;margin-bottom:7px}
.fbottom{border-top:1px solid rgba(255,255,255,.1);padding:18px 0 24px;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;font-size:11.5px}
.fbottom span{opacity:.72}

/* ===================== RESPONSIVE ===================== */
@media(max-width:1180px){
 .grid{grid-template-columns:repeat(3,1fr)}
 .nav button{padding:10px 9px;font-size:10px;letter-spacing:.08em}
}
@media(max-width:1080px){
 .kpis{grid-template-columns:repeat(3,1fr)}
 .fgrid{grid-template-columns:1fr 1fr}
 .u-item:nth-of-type(2){display:none}
}

/* --- tablet / phone: nav collapses into the drawer --- */
@media(max-width:960px){
 :root{--hh:98px}
 .nav{display:none}
 .burger{display:flex}
 .callbtn{display:inline-flex}
 .mainbar .wrap{gap:10px;justify-content:space-between}
 .logo{flex:1;text-align:left}
 .u-right{display:none}
}
@media(max-width:820px){
 .hero .wrap{grid-template-columns:1fr;gap:26px}
 .grid,.two,.locgrid,.fincards,.sched,.kpis,.filters .wrap{min-width:0}
 .grid > *,.kpis > *,.filters .wrap > *,.two > *,.locgrid > *,.fincards > *{min-width:0}
 .panel,.loccard,.fincard,.cpanel,.est,.section > .wrap{min-width:0}
 .days{min-width:0;max-width:100%}
 .slots{min-width:0}

 .fcol ul{margin-top:-4px}

 .steps{grid-template-columns:1fr}
 .wrap{padding:0 16px}
 .fincards{margin-top:26px}
 .grid{grid-template-columns:repeat(2,1fr)}
 .section{padding:32px 0}
 /* a tall sticky filter bar eats a phone screen — let it scroll away */
 .filters{position:static}
 .filters .wrap{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:12px;padding-bottom:12px}
 .fgroup:nth-child(4),.fgroup:nth-child(5){grid-column:span 1}

 .fcount{grid-column:1/-1;margin-left:0;text-align:right}

 select,input[type=text],input[type=tel],input[type=email],input[type=number],input[type=password],input[type=date],textarea{font-size:16px;padding:11px 12px}
 .btn{padding:14px 20px;min-height:48px}
 .mapacts a{padding:16px 6px;font-size:10px}

 .scrim{padding:0;align-items:stretch}
 .modal,.modal.sm{max-width:none;min-height:100%;border:0}

 .bigprice{font-size:38px}

 .stack .btn{width:100%}

 .hero .fam{font-size:9px;letter-spacing:.14em;line-height:1.9}

/* ============================================================
   PRICING ENGINE
============================================================ */
function daysOnFloor(u){ return u.received + state.dayOffset; }
function ageDiscount(u){
  const d = daysOnFloor(u);
  let pct = 0;
  state.pricing.tiers.slice().sort((a,b)=>a.d-b.d).forEach(t=>{ if(d >= t.d) pct = t.p; });
  return pct;
}
function roundRetail(x){
  if(x<=0) return 0;
  return Math.max(Math.floor(x/10)*10 - 1, 9);
}
function priceOf(u){
  const P = state.pricing, list = u.list;
  const agePct = ageDiscount(u);
  const agePrice = list * (1 - agePct/100);
  const compPrice = u.compAvg * (P.compTarget/100);
  let target = list, reason = 'List price';

  if(P.mode === 'off'){ target = list; reason = 'Manual list price. Pricing engine is off.'; }
  else if(P.mode === 'age'){
    target = agePrice;
    reason = agePct>0 ? `Automatic markdown: ${agePct}% off after ${daysOnFloor(u)} days on the floor.` : `No markdown yet — ${daysOnFloor(u)} days on the floor.`;
  }
  else if(P.mode === 'comp'){
    target = compPrice;
    reason = `Priced at ${P.compTarget}% of the local market average ($${Math.round(u.compAvg)}).`;
  }
  else {
    target = Math.min(agePrice, compPrice);
    reason = `Lower of two rules applied (age ${agePct}% → $${roundRetail(agePrice)}  ·  market ${P.compTarget}% → $${roundRetail(compPrice)}).`;
  }

  const floor = u.cost * (1 + P.minMargin/100);
  let floored = false;
  if(target < floor && P.mode !== 'off'){ target = floor; floored = true; reason += ` Held at the ${P.minMargin}% margin floor.`; }

  const final = roundRetail(target);
  const cut = list - final;
  const meaningful = cut >= 20 && final <= list*0.95;
  return {
    price: final, list, discounted: meaningful,
    pctOff: Math.max(0, Math.round((1 - final/list)*100)),
    reason, floored, agePct,
    margin: final - u.cost,
    marginPct: final ? Math.round(((final - u.cost)/final)*100) : 0
  };
}

function nextDays(n){
  const out=[]; const base=new Date();
  for(let i=1;i<=n+6;i++){
    const d=new Date(base.getTime()+i*86400000);
    if(d.getDay()===0) continue;
    out.push(d);
  }
  return out.slice(0,8);
}

const formCache={};
function snapForms(){
  document.querySelectorAll('#app input[id], #app select[id], #app textarea[id]').forEach(el=>{
    if(el.type==='file') return; formCache[el.id]=el.value;
  });
}
function restoreForms(){
  Object.keys(formCache).forEach(id=>{
    const el=document.getElementById(id);
    if(!el || el.type==='file' || el.type==='range') return;
    if(!el.matches('input,select,textarea')) return;
    if(formCache[id]!==undefined && formCache[id]!=='') el.value=formCache[id];
  });
}
function clearForm(ids){ ids.forEach(i=>{ delete formCache[i]; const el=document.getElementById(i); if(el) el.value=''; }); }

    <div class="kpis">
      <div class="kpi"><b>${avail.length}</b><span>Units On Floor</span></div>
      <div class="kpi ${dead?'warn':''}"><b>${dead}</b><span>Aged 60+ Days</span></div>
      <div class="kpi"><b>${money(retail)}</b><span>Retail Value</span></div>
      <div class="kpi good"><b>${money(retail-cost)}</b><span>Gross Margin At Current Price</span></div>
      <div class="kpi hot"><b>${money(volume)}</b><span>Card Volume · 7 Days</span></div>
    </div>
    <div class="ctabs">${CTABS.map(([k,l])=>`<button class="${state.ctab===k?'on':''}" onclick="ctab('${k}')">${l}</button>`).join('')}</div>
    ${inner}
  </div></div>`;
}

/* ---------- INTAKE ---------- */
let pendingPhoto=null;
function cIntake(){
  return `<div class="cpanel">
    <h3>Add a unit to the floor</h3>
    <p class="sub">This is the whole system. Floor staff photographs a machine, fills six fields, hits publish — it is live on the website in under a minute, priced by the engine, counted in the hero unit count. No web developer involved, ever.</p>
    <div class="intakegrid">
      <div>
        <label class="uploadzone ${pendingPhoto?'has':''}" id="uz">
          ${pendingPhoto?`<img src="${pendingPhoto}" alt="">`:''}
          <span class="lbl">${pendingPhoto?'Photo attached — tap to replace':'Tap to add photo'}</span>
          <span class="sm">${pendingPhoto?'':'Camera or file · shot on the tape mark'}</span>
          <input type="file" accept="image/*" style="display:none" onchange="takePhoto(this)">
        </label>
        <p class="hint" style="margin-top:9px">Auto-cropped square for the grid. If no photo is attached the site shows a category placeholder until one is added.</p>
      </div>
      <div>
        <div class="frow">
          <div class="f"><label>Brand</label><input type="text" id="inBrand" placeholder="Whirlpool"></div>
          <div class="f"><label>Category</label><select id="inCat" onchange="suggestPrice()">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div>
          <div class="f full"><label>Model description — this becomes the product name</label><input type="text" id="inModel" placeholder="4.5 cu. ft. Top-Load Washer"></div>
          <div class="f"><label>Serial number</label><input type="text" id="inSerial" placeholder="CX4821-WA"></div>
          <div class="f"><label>Store</label><select id="inLoc">${LOCATIONS.map(l=>`<option>${l}</option>`).join('')}</select></div>
          <div class="f"><label>Condition grade</label>
            <select id="inGrade" onchange="suggestPrice()">
              <option value="A">A — Like new</option><option value="B" selected>B — Light wear</option><option value="C">C — Cosmetic damage</option>
            </select></div>
          <div class="f"><label>Warranty offered</label>
            <select id="inWar"><option>90-day parts &amp; labor</option><option>60-day parts</option><option>30-day parts</option><option>As-is, no warranty</option></select></div>
          <div class="f"><label>What we paid (cost)</label><input type="number" id="inCost" placeholder="260" oninput="suggestPrice()"></div>
          <div class="f"><label>Ask price (list)</label><input type="number" id="inList" placeholder="449"></div>
          <div class="f full"><label>Flaws — say it plainly, it sells the unit</label><input type="text" id="inFlaw" placeholder="Small dent, right door. Does not affect operation."></div>
        </div>
        <div id="suggestBox"></div>
        <button class="btn b-rust" onclick="publishUnit()" style="margin-top:6px">Publish To Website</button>
        <button class="btn b-ghost" style="border-color:rgba(255,255,255,.3);color:var(--paper);margin-left:8px" onclick="fillSample()">Fill Sample Data</button>
      </div>
    </div>
    <div class="callout"><b>Why this matters for Cross:</b> the reason used-appliance dealers have stale websites is that updating one means emailing a web guy. Here, inventory is entered once by the person who already touches the machine, and the site, the price, the store count and the search filters all follow automatically.</div>
  </div>`;
}
function takePhoto(input){
  const f=input.files && input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{ pendingPhoto=e.target.result; render(); };
  r.readAsDataURL(f);
}
function catBaseline(cat,grade){
  const base={'Washer':520,'Dryer':430,'Refrigerator':780,'Range':420,'Dishwasher':300,'Freezer':360,'Microwave':160}[cat]||400;
  const g={A:1.0,B:0.82,C:0.62}[grade]||0.82;
  return Math.round(base*g);
}
function suggestPrice(){
  const catEl=$('inCat'); if(!catEl) return;
  const cat=catEl.value, grade=$('inGrade').value;
  const comp=catBaseline(cat,grade);
  const cost=+($('inCost')?$('inCost').value:0)||0;
  const suggested=roundRetail(Math.max(comp*(state.pricing.compTarget/100), cost*(1+state.pricing.minMargin/100)));
  const box=$('suggestBox'); if(!box) return;
  box.innerHTML=`<div class="drop">
    <div><b style="font-family:var(--fh)">Suggested list: ${money(suggested)}</b>
    <div style="font-size:11.5px;color:var(--brushed)">Local market average for a Grade ${grade} ${cat.toLowerCase()} is about ${money(comp)}.${cost?` Your margin floor at ${state.pricing.minMargin}% is ${money(cost*(1+state.pricing.minMargin/100))}.`:''}</div></div>
    <button class="btn b-rust b-sm" onclick="document.getElementById('inList').value=${suggested}">Use It</button></div>`;
}
function fillSample(){
  $('inBrand').value='Kenmore'; $('inModel').value='Elite 5.2 cu. ft. Front-Load Washer';
  $('inSerial').value='CX'+(Math.floor(Math.random()*9000)+1000)+'-WA';
  $('inCost').value=310; $('inFlaw').value='Light scuff on the lid. Runs clean.';
  suggestPrice(); toast('Sample data filled');
}
function publishUnit(){
  const brand=($('inBrand').value||'').trim(), model=($('inModel').value||'').trim();
  const cost=+$('inCost').value||0, list=+$('inList').value||0;
  if(!brand||!model){ toast('Brand and model are required'); return; }
  if(!list){ toast('Enter an ask price'); return; }
  const cat=$('inCat').value, grade=$('inGrade').value;
  const u=mk(brand,model,cat,grade,cost,list,catBaseline(cat,grade),0,$('inLoc').value,($('inFlaw').value||'').trim(),$('inWar').value);
  if(($('inSerial').value||'').trim()) u.serial=$('inSerial').value.trim();
  u.photo=pendingPhoto;
  state.units.unshift(u);
  pendingPhoto=null;
  clearForm(['inBrand','inModel','inSerial','inCost','inList','inFlaw']);
  toast('Published — live on the website now');
  state.mode='customer'; state.view='shop';
  state.filters={cat:'all',loc:'all',grade:'all',max:2000,sort:'new'};
  window.scrollTo(0,0); render();
}

/* ---------- INVENTORY ---------- */
function cInventory(){
  const rows=state.units.map(u=>({u,p:priceOf(u)})).sort((a,b)=>daysOnFloor(b.u)-daysOnFloor(a.u));
  return `<div class="cpanel">
    <h3>Every unit, every store</h3>
    <p class="sub">Sorted by days on the floor — the oldest money first. Prices below are what the website is showing right now, recalculated by the pricing engine on every page load.</p>
    <div style="overflow-x:auto"><table class="dt">
      <tr><th>Unit</th><th>Store</th><th>Grade</th><th>Days</th><th class="num">Cost</th><th class="num">List</th><th class="num">Live Price</th><th class="num">Margin</th><th>Status</th><th></th></tr>
      ${rows.map(({u,p})=>`<tr>
        <td><div class="tdname"><div class="thumb">${unitImage(u)}</div>
          <div><b>${u.brand} ${u.model}</b><span>${u.serial}${u.flaw?' · '+u.flaw:''}</span></div></div></td>
        <td style="font-size:12px">${u.loc}</td>
        <td><span class="chip ${GRADE_CLASS[u.grade]}">${u.grade}</span></td>
        <td class="num" style="${daysOnFloor(u)>=60?'color:#C88A14':''}">${daysOnFloor(u)}</td>
        <td class="num" style="color:var(--brushed)">${money(u.cost)}</td>
        <td class="num" style="color:var(--brushed)">${money(u.list)}</td>
        <td class="num">${money(p.price)} ${p.discounted?`<span class="dropcell">−${p.pctOff}%</span>`:''}</td>
        <td class="num" style="color:${p.marginPct<20?'#E5713F':'#57C08B'}">${money(p.margin)} <span style="font-weight:400;font-size:11px;color:var(--brushed)">${p.marginPct}%</span></td>
        <td>${u.status==='available'?'<span class="chip c-a">Live</span>':u.status==='reserved'?'<span class="chip c-c">Reserved</span>':'<span class="chip c-sold">Sold</span>'}</td>
        <td>${u.status==='sold'?'':`<button class="btn b-ghost b-sm" style="border-color:rgba(255,255,255,.3);color:var(--paper)" onclick="markSold(${u.id})">Mark Sold</button>`}</td>
      </tr>`).join('')}
    </table></div>
  </div>`;
}
function markSold(id){
  const u=state.units.find(x=>x.id===id); if(!u) return;
  const p=priceOf(u); u.status='sold';
  state.payments.push({ref:confNum('SALE'),type:'Counter sale',desc:`${u.brand} ${u.model}`,customer:'Walk-in',amount:p.price,status:'Approved',when:new Date(),balance:0});
  toast('Marked sold — pulled from the website');
  render();
}

/* ---------- PRICING ---------- */
function cPricing(){
  const P=state.pricing;
  const avail=availableUnits().map(u=>({u,p:priceOf(u)}));
  const dropping=avail.filter(x=>x.p.discounted).sort((a,b)=>b.p.pctOff-a.p.pctOff);
  const floored=avail.filter(x=>x.p.floored).length;
  const lost=avail.reduce((s,x)=>s+(x.u.list-x.p.price),0);

  return `
  <div class="simbar">
    <div class="t"><b>Demo control — advance the calendar</b><span style="font-size:12.5px;color:var(--fog)">+${state.dayOffset} days from today</span></div>
    <input type="range" min="0" max="120" step="1" value="${state.dayOffset}" oninput="setOffset(+this.value)">
    <p style="font-size:12.5px;color:var(--fog);margin-top:6px">Drag it forward and watch the floor reprice itself. This slider exists only for the demo — in production the clock does this on its own, overnight, with no one touching a keyboard.</p>
  </div>

  <div class="cpanel">
    <h3>Pricing rules</h3>
    <p class="sub">Two independent rules. Age markdown protects turn. Market comp protects position. When both run, the engine takes the lower of the two and then refuses to go below the margin floor.</p>
    <div class="modes">
      <button class="${P.mode==='off'?'on':''}" onclick="setPMode('off')">Off — manual</button>
      <button class="${P.mode==='age'?'on':''}" onclick="setPMode('age')">Age markdown</button>
      <button class="${P.mode==='comp'?'on':''}" onclick="setPMode('comp')">Market comp</button>
      <button class="${P.mode==='both'?'on':''}" onclick="setPMode('both')">Both</button>
    </div>
    <div class="pricegrid">
      <div style="${P.mode==='comp'||P.mode==='off'?'opacity:.35;pointer-events:none':''}">
        <h3 style="font-size:12px">Age markdown tiers</h3>
        <p class="sub" style="margin-bottom:12px">Once a unit passes a threshold, the discount applies automatically and the site shows a price-drop badge.</p>
        ${P.tiers.map((t,i)=>`<div class="tier">
          <div class="f"><label>After (days)</label><input type="number" value="${t.d}" onchange="setTier(${i},'d',+this.value)"></div>
          <div class="f"><label>Discount (%)</label><input type="number" value="${t.p}" onchange="setTier(${i},'p',+this.value)"></div>
          <div style="font-size:11.5px;color:var(--brushed);padding-bottom:10px">${availableUnits().filter(u=>daysOnFloor(u)>=t.d).length} units</div>
        </div>`).join('')}
      </div>
      <div style="${P.mode==='age'||P.mode==='off'?'opacity:.35;pointer-events:none':''}">
        <h3 style="font-size:12px">Market comp target</h3>
        <p class="sub" style="margin-bottom:12px">Where you want to sit against comparable local listings. 100% is dead-on the average; below undercuts it.</p>
        <div class="rangewrap">
          <div style="display:flex;justify-content:space-between;font-family:var(--fh);font-weight:800;font-size:13px;margin-bottom:6px">
            <span>Price at</span><span>${P.compTarget}% of local average</span></div>
          <input type="range" min="80" max="115" value="${P.compTarget}" oninput="setComp(+this.value)">
        </div>
        <h3 style="font-size:12px;margin-top:20px">Margin floor</h3>
        <p class="sub" style="margin-bottom:12px">The hard stop. No rule may price a unit below this margin over what you paid.</p>
        <div class="rangewrap">
          <div style="display:flex;justify-content:space-between;font-family:var(--fh);font-weight:800;font-size:13px;margin-bottom:6px">
            <span>Never below</span><span>${P.minMargin}% margin</span></div>
          <input type="range" min="0" max="60" value="${P.minMargin}" oninput="setMargin(+this.value)">
        </div>
        <p class="hint">${floored} unit${floored===1?'':'s'} currently held at the floor.</p>
      </div>
    </div>
  </div>

  <div class="cpanel">
    <h3>What the rules are doing right now</h3>
    <p class="sub">${dropping.length} of ${avail.length} units are marked down. Total price concession across the floor: <b style="color:#E5713F">${money(lost)}</b> — which is what it costs to move ${dropping.length} machines that would otherwise still be sitting there.</p>
    ${dropping.length? dropping.slice(0,8).map(({u,p})=>`
      <div class="drop">
        <div style="display:flex;align-items:center;gap:11px;min-width:0">
          <div class="thumb">${unitImage(u)}</div>
          <div style="min-width:0"><b style="font-family:var(--fh);font-size:13px">${u.brand} ${u.model}</b>
          <div style="font-size:11px;color:var(--brushed);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.reason}</div></div>
        </div>
        <div style="text-align:right;white-space:nowrap">
          <div style="font-family:var(--fh);font-weight:900;font-size:16px">${money(p.price)}</div>
          <div style="font-size:11px;color:var(--brushed);text-decoration:line-through">${money(u.list)}</div>
        </div>
      </div>`).join('') : `<p style="font-size:13px;color:var(--brushed)">No markdowns active. Push the calendar slider forward or turn a rule on.</p>`}
    ${dropping.length>8?`<p class="hint" style="margin-top:8px">+ ${dropping.length-8} more.</p>`:''}
    <div class="callout"><b>The honest caveat:</b> market comp needs a real data feed to be worth anything — scraped local listings or a wholesale index. That is a phase-two build. Age markdown works on day one with nothing but your own intake dates, and it is the rule that actually fixes dead stock.</div>
  </div>`;
}
function setOffset(v){ state.dayOffset=v; render(); }
function setPMode(m){ state.pricing.mode=m; render(); }
function setTier(i,k,v){ state.pricing.tiers[i][k]=v; render(); }
function setComp(v){ state.pricing.compTarget=v; render(); }
function setMargin(v){ state.pricing.minMargin=v; render(); }

/* ---------- SCHEDULE ---------- */
function cSchedule(){
  const days=nextDays(10);
  const totalCap=DELIVERY_SLOTS.reduce((s,[,c])=>s+c,0)+SERVICE_SLOTS.reduce((s,[,c])=>s+c,0);
  const booked=state.deliveries.length+state.service.length;
  return `<div class="cpanel">
    <h3>Schedule board</h3>
    <p class="sub">Deliveries and service calls in one view, capped by real truck and tech capacity. When a window fills, the website stops offering it — no double-booking, no callback to reschedule. <b style="color:#fff">${booked} jobs booked</b> across the next eight working days.</p>
    <div class="sched">
      ${days.map(d=>{
        const k=dkey(d);
        const del=state.deliveries.filter(x=>x.dateKey===k);
        const svc=state.service.filter(x=>x.dateKey===k);
        const n=del.length+svc.length;
        const pct=Math.min(100, Math.round(n/totalCap*100));
        const cls = pct>=80?'full':(pct>=40?'busy':'');
        return `<div class="sday">
          <h4>${d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</h4>
          <div class="cap">${n} of ${totalCap} slots booked</div>
          <div class="capbar"><i class="${cls}" style="width:${pct}%"></i></div>
          ${del.map(x=>`<div class="job"><b>${x.customer}</b><span>${x.slot}<br>${x.item}<br>${x.addr}</span></div>`).join('')}
          ${svc.map(x=>`<div class="job svc"><b>${x.customer}</b><span>${x.slot}<br>${x.item}<br>${x.addr}</span></div>`).join('')}
          ${(!n)?`<div class="nojobs">Nothing booked</div>`:''}
        </div>`;
      }).join('')}
    </div>
    <div class="callout"><b>Green = delivery. Amber = service call.</b> Book one from the customer side and it lands here instantly. In production this pushes to the drivers' phones and writes back to the office calendar.</div>
  </div>`;
}

/* ---------- PAYMENTS ---------- */
function cPayments(){
  const P=state.payments.slice().sort((a,b)=>b.when-a.when);
  const week=Date.now()-7*86400000;
  const recent=P.filter(x=>x.when.getTime()>=week);
  const vol=recent.reduce((s,x)=>s+x.amount,0);
  const est=vol*0.029+recent.length*0.30;
  const outstanding=P.reduce((s,x)=>s+(x.balance||0),0);
  const L=state.leads.slice().sort((a,b)=>b.when-a.when);
  return `<div class="cpanel">
    <h3>Payments ledger</h3>
    <p class="sub">Every deposit, delivery fee, service call and counter sale in one place, tied back to a unit. Simulated in this prototype — production routes through Accept Blue, provisioned by AlliedOne.</p>
    <div style="overflow-x:auto"><table class="dt">
      <tr><th>Date</th><th>Reference</th><th>Type</th><th>What</th><th>Customer</th><th class="num">Amount</th><th class="num">Balance Due</th><th>Status</th></tr>
      ${P.map(x=>`<tr>
        <td style="white-space:nowrap;color:var(--brushed);font-size:12px">${dshort(x.when)}</td>
        <td style="font-family:ui-monospace,Menlo,monospace;font-size:11.5px">${x.ref}</td>
        <td style="white-space:nowrap">${x.type}</td><td style="font-size:12px">${x.desc}</td><td style="font-size:12px">${x.customer}</td>
        <td class="num">${money(x.amount)}</td>
        <td class="num" style="color:var(--brushed)">${x.balance?money(x.balance):'—'}</td>
        <td><span class="chip c-a">${x.status}</span></td></tr>`).join('')}
    </table></div>
    <div class="kpis" style="margin-top:20px">
      <div class="kpi"><b>${money(vol)}</b><span>Card Volume · 7 Days</span></div>
      <div class="kpi"><b>${recent.length}</b><span>Transactions · 7 Days</span></div>
      <div class="kpi"><b>${money(est)}</b><span>Est. Processing Cost</span></div>
      <div class="kpi warn"><b>${money(outstanding)}</b><span>Balances Owed On Holds</span></div>
    </div>
    <div class="callout"><b>The point of putting payments here:</b> deposits stop no-shows on held units, delivery fees get collected before the truck rolls instead of chased after, and service calls are paid at booking. Cross is currently running all three of those on trust and a phone call.</div>
  </div>

  <div class="cpanel">
    <h3>Financing applications started on the website</h3>
    <p class="sub">Every customer who taps Acima or Snap on the financing page becomes a named lead with a phone number — instead of a browser tab they closed at 11pm.</p>
    ${L.length?`<div style="overflow-x:auto"><table class="dt">
      <tr><th>Date</th><th>Reference</th><th>Customer</th><th>Partner</th><th>Spend Band</th><th>Store</th><th>Status</th></tr>
      ${L.map(x=>`<tr>
        <td style="white-space:nowrap;color:var(--brushed);font-size:12px">${dshort(x.when)}</td>
        <td style="font-family:ui-monospace,Menlo,monospace;font-size:11.5px">${x.ref}</td>
        <td>${x.name}</td><td>${x.partner}</td><td style="font-size:12px">${x.band}</td>
        <td style="font-size:12px">${x.loc}</td><td><span class="chip c-c">${x.status}</span></td></tr>`).join('')}
    </table></div>`:`<p style="font-size:13px;color:var(--brushed)">No financing applications started yet.</p>`}
  </div>`;
}

/* ============================================================
   MODAL
============================================================ */
function modal(title, body, size){
  $('modalHost').innerHTML=`<div class="scrim" onclick="if(event.target===this)closeModal()">
    <div class="modal ${size||''}">
      <div class="mhead"><h3>${title}</h3><button onclick="closeModal()">&times;</button></div>
      <div class="mbody">${body}</div>
    </div></div>`;
  document.body.style.overflow='hidden';
}
function closeModal(){ $('modalHost').innerHTML=''; document.body.style.overflow=''; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

seedOperations();
render();
</script>
</body>
</html>
